<div class="detalhe-container">

  <p *ngIf="carregando">Carregando livro...</p>

  <p class="erro" *ngIf="mensagemErro">
    {{ mensagemErro }}
  </p>

  <div *ngIf="livro && !carregando">

    <h1>{{ livro.titulo }}</h1>

    <p>
      <strong>Autor:</strong>
      {{ livro.autor }}
    </p>

    <p>
      <strong>Categoria:</strong>
      {{ livro.categoria }}
    </p>

    <p>
      <strong>Ano:</strong>
      {{ livro.ano }}
    </p>

    <p>
      <strong>Status:</strong>
      {{ livro.status }}
    </p>

    <p *ngIf="livro.descricao">
      <strong>Descrição:</strong>
      {{ livro.descricao }}
    </p>

  </div>

  <a routerLink="/livros" class="voltar">
    Voltar para a lista
  </a>

</div>
